name: Live quotes
# GitHub runs scheduled workflows roughly once an hour at best, so each run loops
# internally and refreshes quotes.json every 15 minutes until the next run takes over.
on:
  schedule:
    - cron: "2 12-21 * * 1-5"      # hourly, 09:02-18:02 São Paulo, weekdays
    - cron: "20 22 * * 1-5"        # after the official close
  push:
    branches: [main]
    paths: ["tickers.json", "tools/quotes.mjs", ".github/workflows/quotes.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quotes
  cancel-in-progress: true
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh every 15 minutes
        run: |
          git config user.name "market-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for round in 1 2 3 4 5; do
            git pull -q --rebase origin main || true
            node tools/quotes.mjs || true
            git add quotes.json
            if ! git diff --cached --quiet; then
              git commit -qm "Live quotes"
              for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
            fi
            hour=$(TZ=America/Sao_Paulo date +%H%M)
            if [ "$round" = 5 ] || [ "$hour" -ge 1830 ] || [ "$hour" -lt 0950 ]; then break; fi
            sleep 900
          done
