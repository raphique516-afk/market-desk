name: Company facts
on:
  schedule:
    - cron: "40 10 * * 1"   # Mondays 07:40 São Paulo
  push:
    branches: [main]
    paths: ["tools/fundamentals.mjs", ".github/workflows/fundamentals.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: facts
  cancel-in-progress: false
jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fundamentals.mjs
      - name: Commit
        run: |
          git config user.name "market-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fundamentals.json
          git diff --cached --quiet && exit 0
          git commit -qm "Company facts"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
