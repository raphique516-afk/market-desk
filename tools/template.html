<title>Market Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky desk header with four tabs; working column + compact agent rail (rail stacks on top at phone width). */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#d8dee7; --line-2:#e7ebf1;
  --ink:#121c29; --ink-2:#435063; --ink-3:#6c788a;
  --accent:#b46a00; --accent-ink:#ffffff; --accent-soft:#fbefdc;
  --up:#0f7a4a; --up-soft:#e2f3ea; --down:#c0352b; --down-soft:#fbe6e3; --warn:#9a6200; --warn-soft:#fdf1d8;
  --focus:#2f5bd3;
  --band:#0e1a2b; --band-2:#16263d; --band-ink:#e9eef6; --band-mute:#8fa1b8;
  --c1:#2f6db5; --c2:#c27c0e; --c3:#2e8b57; --c4:#8e4ec6; --c5:#d0543e; --c6:#1a9aa0; --c7:#b5487a; --c8:#6b7a2a; --c9:#5a6b80;
  --shadow:0 1px 2px rgba(14,26,43,.06),0 4px 14px rgba(14,26,43,.06);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131c; --surface:#141c27; --surface-2:#18212e; --line:#263243; --line-2:#1f2a38;
  --ink:#e6ebf2; --ink-2:#a9b4c3; --ink-3:#7c889a;
  --accent:#f0a33a; --accent-ink:#1a1206; --accent-soft:#33260f;
  --up:#3ccf8e; --up-soft:#10291f; --down:#ff7a6e; --down-soft:#341816; --warn:#f0b54a; --warn-soft:#30250f;
  --focus:#7ea2ff;
  --band:#080d15; --band-2:#111a27; --band-ink:#e6ebf2; --band-mute:#7c889a;
  --c1:#6aa3e8; --c2:#f0a33a; --c3:#4cc38a; --c4:#b48cf0; --c5:#ff8a73; --c6:#4fd1d6; --c7:#e98ab5; --c8:#b5c25a; --c9:#9aaabf;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131c; --surface:#141c27; --surface-2:#18212e; --line:#263243; --line-2:#1f2a38;
  --ink:#e6ebf2; --ink-2:#a9b4c3; --ink-3:#7c889a;
  --accent:#f0a33a; --accent-ink:#1a1206; --accent-soft:#33260f;
  --up:#3ccf8e; --up-soft:#10291f; --down:#ff7a6e; --down-soft:#341816; --warn:#f0b54a; --warn-soft:#30250f;
  --focus:#7ea2ff;
  --band:#080d15; --band-2:#111a27; --band-ink:#e6ebf2; --band-mute:#7c889a;
  --c1:#6aa3e8; --c2:#f0a33a; --c3:#4cc38a; --c4:#b48cf0; --c5:#ff8a73; --c6:#4fd1d6; --c7:#e98ab5; --c8:#b5c25a; --c9:#9aaabf;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-3)}
.label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--ink-3)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
header.desk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink);border-bottom:1px solid var(--band-2)}
header.desk .brand b{color:var(--band-ink)}
header.desk .brand b i{font-style:normal;color:var(--accent)}
header.desk .brand span{color:var(--band-mute)}
header.desk nav.tabs{background:var(--band-2);border-color:transparent}
header.desk nav.tabs button{color:var(--band-mute)}
header.desk nav.tabs button:hover{color:var(--band-ink)}
header.desk nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
header.desk .status{color:var(--band-mute)}
header.desk .btn{background:transparent;border-color:var(--band-2);color:var(--band-ink)}
header.desk .btn:hover{border-color:var(--band-mute)}
.tape{border-top:1px solid var(--band-2);overflow:hidden;white-space:nowrap;font-family:var(--f-mono);font-size:12px;color:var(--band-mute);-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tape-in{display:inline-flex;gap:28px;padding-block:7px;animation:tape 60s linear infinite;padding-left:16px}
.tape:hover .tape-in{animation-play-state:paused}
.tape b{color:var(--band-ink);font-weight:600;margin-right:6px}
.tape .up{color:var(--up)} .tape .down{color:var(--down)}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tape{overflow-x:auto}.tape-in{animation:none}}
.desk-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.01em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
nav.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:5px 13px;border-radius:999px;cursor:pointer;font-family:var(--f-display);font-weight:600;letter-spacing:.03em;color:var(--ink-2)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
nav.tabs .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-family:var(--f-mono);line-height:16px;text-align:center}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px var(--up-soft)}
.dot.stale{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--down);border-color:var(--down)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.sm{padding:3px 9px;font-size:12px}

main.grid{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;padding-block:20px 48px}
main.grid.wide{grid-template-columns:minmax(0,1fr)}
main.grid.wide aside.agent{display:none}
@media (max-width:980px){main.grid{grid-template-columns:minmax(0,1fr)} aside.agent{order:-1;position:static!important;max-height:none!important}}
.content{min-width:0;display:flex;flex-direction:column;gap:16px}
#c-head,#c-form,#c-body{display:flex;flex-direction:column;gap:16px;min-width:0}
#c-head:empty,#c-form:empty,#c-body:empty{display:none}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.notice.err{border-color:var(--down);background:var(--down-soft)}
.notice p{margin:0;flex:1 1 260px;min-width:0}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:720px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.stat .v small{font-size:12px;font-weight:500;color:var(--ink-3)}
.stat .s{font-size:12px;font-family:var(--f-mono)}
.up{color:var(--up)} .down{color:var(--down)}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h2{font-family:var(--f-display);font-size:18px;margin:0;font-weight:600;letter-spacing:.01em}
.bar .sp{flex:1}

form.pos{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){form.pos{grid-template-columns:repeat(2,minmax(0,1fr))}}
form.pos .full{grid-column:1/-1}
form.pos .half{grid-column:span 2}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld input,.fld select,.fld textarea,textarea.notes{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:7px 9px;width:100%;min-width:0}
.fld textarea,textarea.notes{resize:vertical;min-height:72px;line-height:1.45}
.fld .hint{font-size:11.5px;color:var(--ink-3)}
.form-actions{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-family:var(--f-mono);font-size:12px;cursor:pointer;background:var(--surface-2)}
.checks input{margin:0}

.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;box-shadow:var(--shadow)}
table.pf{width:100%;border-collapse:collapse;min-width:880px}
table.pf th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;font-weight:600;color:var(--ink-3);text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.pf th:first-child,table.pf td:first-child{text-align:left}
table.pf td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:right;vertical-align:middle;white-space:nowrap}
table.pf tr.row{cursor:pointer}
table.pf tr.row:hover td{background:var(--surface-2)}
table.pf tr.row.open td{background:var(--surface-2);border-bottom-color:transparent}
.tk{display:flex;flex-direction:column;gap:1px}
.tk b{font-family:var(--f-mono);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.cdot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.tk span{font-size:12px;color:var(--ink-3);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:11.5px;color:var(--ink-3)}
.chg{display:inline-block;padding:1px 7px;border-radius:4px;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.chg.up{background:var(--up-soft)} .chg.down{background:var(--down-soft)}
.range{width:120px;display:inline-flex;flex-direction:column;gap:3px;vertical-align:middle}
.range .track{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--down-soft),var(--line-2) 50%,var(--up-soft));border:1px solid var(--line)}
.range .pin{position:absolute;top:-4px;width:3px;height:12px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.range .ends{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.pill.buy{background:var(--up-soft);color:var(--up);border-color:var(--up)}
.pill.sell{background:var(--down-soft);color:var(--down);border-color:var(--down)}
.pill.trim{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pill.hold{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.pill.watch{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pill.none{color:var(--ink-3);border-color:var(--line)}
tr.detail td{background:var(--surface-2);text-align:left;white-space:normal;padding:4px 12px 16px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:720px){.detail-grid{grid-template-columns:minmax(0,1fr)}}
.detail-grid h4,.card h4{margin:0 0 6px;font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-family:var(--f-mono)}
.mini-news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mini-news a{text-decoration:none;font-weight:500}
.mini-news a:hover{text-decoration:underline}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h3{margin:0;font-family:var(--f-display);font-size:18px}
.empty p{margin:0;max-width:62ch;color:var(--ink-2)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;font-family:var(--f-mono)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.news{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.art{padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:5px;min-width:0}
.art:last-child{border-bottom:0}
.art .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.tag.mine{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.art h3{margin:0;font-size:15.5px;line-height:1.35;font-weight:600;text-wrap:balance}
.art h3 a{text-decoration:none}
.art h3 a:hover{text-decoration:underline}
.art p{margin:0;color:var(--ink-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:80ch}
.art.ref{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.art .actions{display:flex;gap:6px;margin-top:4px}

/* Agent briefing */
.brief-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.brief-head .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brief-head h2{margin:0;font-family:var(--f-display);font-size:20px}
.truth{background:linear-gradient(135deg,var(--band),var(--band-2));color:var(--band-ink);box-shadow:var(--shadow);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.truth .label{color:var(--accent)}
.truth p{margin:0;font-size:15px;line-height:1.55;max-width:75ch}
.provs{display:flex;flex-direction:column;gap:8px;margin:4px 0 0;padding:0;list-style:none}
.provs li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-style:italic;line-height:1.45}
.provs li::before{content:"?";flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 13px/22px var(--f-mono);text-align:center;font-style:normal}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .top b{font-family:var(--f-mono);font-size:15px}
.card .top .conf{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.card h3{margin:0;font-size:15px;line-height:1.35}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}
.card .crit{border-left:3px solid var(--down);padding-left:10px;color:var(--ink)}
.card .prov{background:var(--accent-soft);border-radius:6px;padding:8px 10px;font-style:italic;color:var(--ink)}
.card .watch,.sig .watch{font-size:12.5px;border-left:2px solid var(--accent);padding-left:8px;color:var(--ink)}
.refs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-3)}
.refs button{border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:0 6px;font-family:var(--f-mono);font-size:11px;cursor:pointer}
.rc{font-size:11.5px;font-family:var(--f-mono)}
.rc.supports{color:var(--up)} .rc.challenges{color:var(--down)}
.progress{display:flex;gap:10px;align-items:center;color:var(--ink-2);font-size:13px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.art.ref{animation:none}}
.skel{height:12px;border-radius:4px;background:var(--line-2);margin:6px 0}

/* Agent rail */
aside.agent{box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.ag-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r) var(--r) 0 0;display:flex;flex-direction:column;gap:8px;background:var(--surface);position:sticky;top:0;z-index:1}
.ag-title{display:flex;align-items:center;gap:8px}
.ag-title h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700}
.ag-title .sp{flex:1}
.ag-sub{font-size:12px;color:var(--ink-3)}
.ag-block{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.ag-block p{margin:0;font-size:13px;color:var(--ink-2)}
.sig{padding:10px 16px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px;cursor:pointer}
.sig:hover{background:var(--surface-2)}
.sig-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sig-top b{font-family:var(--f-mono);font-size:13.5px}
.sig p{margin:0;font-size:12.5px;color:var(--ink-2)}
.ag-foot{padding:10px 16px 14px;font-size:11.5px;color:var(--ink-3)}
.card.wide{grid-column:1/-1}
.deep{border-top:1px solid var(--line);padding-top:12px;margin-top:2px;display:flex;flex-direction:column;gap:12px}
.deep .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.deep .top .conf{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.deep-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){.deep-cols{grid-template-columns:minmax(0,1fr)}}
ul.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
ul.bul.red li::marker{color:var(--down)}

  <aside class="agent" id="agent" aria-label="Desk agent"></aside>
</main>

<script>
(() => {
"use strict";
const AV = "Alpha Vantage MCP Server", BD = "Bigdata.com", TD = "Twelve Data";
const REFRESH = 15 * 60 * 1000, SLOW = 60 * 60 * 1000;
const AUTH_CODES = ["needs_reauth","server_not_connected","not_in_manifest","approval_required","blocked_by_policy","consent_required"];

const S = {
  noRuntime:false, noStore:false, uid:null,
  holdings:null, holdErr:null, reports:[],
  quotes:{}, quoteErr:{}, td:{}, tdErr:{}, tear:{}, tearErr:null, tearAt:0,
  mkt:{}, mktErr:{}, co:{}, coErr:{}, calls:{}, callsErr:{},
  agent:null, agentBusy:false, agentErr:null, progress:"",
  tab:"portfolio", newsFilter:"all", open:null, editing:null, formOpen:false, formMsg:"", formBusy:false, confirmDel:null,
  repOpen:false, repMsg:"", repBusy:false, repDel:null, repFilter:"all",
  pack:{ busy:false, msg:"", log:[] }, backup:{}, backupAt:0, feed:null, macro:null, memory:null, history:[], fbOpen:null, deep:{}, deepBusy:null, deepErr:{}, deepOpen:null, deepQueue:[], deepProgress:"",
  lastData:0, sampleOK:true
};
let db=null, mcp=null, sample=null, perms=null, holdCol=null, repCol=null, deepCol=null, agentRef=null;
let packCtl = null, deepCtl = null, histCol = null, memRef = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const safeId = s => String(s).replace(/[^A-Za-z0-9_-]/g, "_");
const watches = new Map();
let agentCtl = null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtMoney = (v, cur) => { if (v==null || !isFinite(v)) return "—"; try { return new Intl.NumberFormat("en-US",{style:"currency",currency:cur||"USD",minimumFractionDigits:2,maximumFractionDigits:2}).format(v);} catch { return v.toFixed(2);} };
const fmtNum = (v, d=2) => (v==null||!isFinite(v)) ? "—" : v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtPct = v => (v==null||!isFinite(v)) ? "—" : (v>0?"+":"") + v.toFixed(2) + "%";
const cls = v => v>0 ? "up" : v<0 ? "down" : "";
const parseTs = t => { if(!t) return NaN; const s = /[zZ]|[+-]\d\d:?\d\d$/.test(t) ? t : t + "Z"; return Date.parse(s); };
function ago(ms){ if(!isFinite(ms)) return ""; const d=(Date.now()-ms)/1000; if(d<60) return "just now"; if(d<3600) return Math.round(d/60)+" min ago"; if(d<86400) return Math.round(d/3600)+" h ago"; return Math.round(d/86400)+" d ago"; }
const isoDay = ms => isFinite(ms) ? new Date(ms).toISOString().slice(0,10) : "undated";
const asObj = p => { if (typeof p === "string") { try { return JSON.parse(p); } catch { return { _text:p }; } } return p || {}; };
const stamp = r => (r && r.cache && r.cache.storedAt) || Date.now();
const needsAllow = e => ["not_in_manifest","approval_required","consent_required"].includes(e?.code);

function errCopy(e, server){
  const s = server || e?.server || "the connector";
  switch (e?.code) {
    case "needs_reauth": return `Reconnect ${s} in claude.ai Settings → Connectors.`;
    case "server_not_connected": case "selection_required": case "server_not_found": return `Add ${s} in claude.ai Settings → Connectors.`;
    case "not_in_manifest": case "approval_required": case "consent_required": return `${s} isn't allowed for this page yet.`;
    case "blocked_by_policy": return `Your organization blocks this ${s} tool.`;
    case "server_unavailable": case "rate_limited": return `${s} didn't answer. Showing the last data; it retries on the next refresh.`;
    case "tool_error": return `${s} reported an error: ${String(e.message||"").slice(0,160)}`;
    case "not_granted": case "capability_disabled": case "capability_removed": return `Connectors aren't available in this view.`;
    default: return `${s} failed (${e?.code||"error"}).`;
  }
}

/* ---------- parsing ---------- */
function parseQuote(p){
  p = asObj(p);
  const q = p["Global Quote"];
  if (q && q["05. price"]) return { price:+q["05. price"], prev:+q["08. previous close"], chgPct:parseFloat(q["10. change percent"]), day:q["07. latest trading day"], high:+q["03. high"], low:+q["04. low"] };
  const msg = p?.error?.message || p?.Information || p?.Note || p?._text || "No quote returned for this symbol.";
  return { err:String(msg), limited:/rate|limit|premium|frequency|per day/i.test(msg) };
}
function parseTD(p){
  p = asObj(p);
  const txt = typeof p.result === "string" ? p.result : (typeof p._text === "string" ? p._text : null);
  if (txt && txt.includes("\n") && txt.includes(";")) {
    const [h, row] = txt.trim().split("\n"); const k = h.split(";"), v = (row||"").split(";");
    const o = {}; k.forEach((key,i) => o[key] = v[i]);
    if (o.close) return { price:+o.close, chgPct:+o.percent_change, day:o.datetime, high:+o.high, low:+o.low, w52:[+o.fifty_two_week_low, +o.fifty_two_week_high] };
  }
  if (p.close) return { price:+p.close, chgPct:+p.percent_change, day:p.datetime, high:+p.high, low:+p.low };
  const msg = txt || p.message || "No quote returned.";
  return { err:String(msg).split("\n")[0].slice(0,200), plan:/plan|upgrad/i.test(msg) };
}
function parseNews(p, tag){
  p = asObj(p);
  return (p.results || []).map(r => ({
    id:r.id, headline:r.headline || "(untitled)", t:parseTs(r.timestamp), source:r.source?.name || "",
    url:r.url || "", text:(r.chunks||[]).map(c=>c.text).join(" ").replace(/\s+/g," ").trim(), tag
  }));
}
function parseTear(p){ p = asObj(p); const out = {}; for (const r of (p.structured || [])) out[r.rp_entity_id] = r; return out; }

/* ---------- prices: Bigdata.com exact listing → Alpha Vantage → Twelve Data ---------- */
function bdRow(h){
  const t = h.rpId && S.tear[h.rpId];
  if (!t || !t.price || t.price.value == null) return null;
  const want = h.currency === "BRL" ? h.label + ".SA" : h.label;
  return String(t.ticker || "").toUpperCase() === want ? t : null;
}
function priceFor(h){
  const c = [];
  const t = bdRow(h); if (t) c.push({ price:t.price.value, chgPct:t.change_1d_pct, src:"Bigdata.com", day:(t.price.as_of||"").slice(0,10) });
  const q = S.quotes[h.symbol]; if (q && isFinite(q.price)) c.push({ price:q.price, chgPct:q.chgPct, src:"Alpha Vantage", day:q.day||"" });
  const d = S.td[h.symbol]; if (d && isFinite(d.price)) c.push({ price:d.price, chgPct:d.chgPct, src:"Twelve Data", day:d.day||"" });
  const b = S.backup[h.label]; if (b && isFinite(+b.price)) c.push({ price:+b.price, chgPct:+b.chgPct, src:(b.src||"backup") + " (hourly)", day:b.day||"" });
  if (!c.length) return null;
  return c.reduce((best, x) => x.day > best.day ? x : best, c[0]);
}
const PALETTE = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8","--c9"];
function colorFor(label){ const i = (S.holdings||[]).findIndex(h => h.label === label); return `var(${PALETTE[(i < 0 ? 0 : i) % PALETTE.length]})`; }
function weights(R){ const tot = {}; for (const r of R) tot[r.h.currency] = (tot[r.h.currency]||0) + (r.value||0); return Object.fromEntries(R.map(r => [r.h.label, tot[r.h.currency] ? (r.value||0)/tot[r.h.currency]*100 : null])); }
function renderTape(){
  const el = $("#tape"); if (!el) return;
  const items = rows().filter(r => r.px).map(r => `<span><b>${esc(r.h.label)}</b>${fmtNum(r.px.price)} <span class="${cls(r.px.chgPct)}">${fmtPct(r.px.chgPct)}</span></span>`);
  const m = S.macro?.di?.find(x => x.c === "DI1F29");
  if (m) items.push(`<span><b>DI jan/29</b>${(+m.r).toFixed(2)}%</span>`);
  if (S.macro?.selic) items.push(`<span><b>Selic</b>${esc(S.macro.selic)}%</span>`);
  const html = items.length ? `<div class="tape-in">${items.join("")}${items.join("")}</div>` : "";
  if (el.__h !== html) { el.innerHTML = html; el.__h = html; el.hidden = !items.length; }
}
function rows(){
  return (S.holdings||[]).map(h => {
    const px = priceFor(h);
    const shares = +h.shares || 0, avg = +h.avgCost || 0;
    const value = px ? px.price*shares : null, cost = avg*shares;
    const pnl = px ? value - cost : null;
    const pnlPct = px && avg ? (px.price/avg - 1)*100 : null;
    const dayPnl = px && isFinite(px.chgPct) ? value - value/(1+px.chgPct/100) : null;
    return { h, px, shares, avg, value, cost, pnl, pnlPct, dayPnl };
  });
}
function signalFor(label){ return (S.agent?.signals || []).find(x => String(x.symbol||"").toUpperCase() === String(label).toUpperCase()); }
function pillFor(action){
  const a = String(action||"").toUpperCase();
  const c = a.startsWith("BUY") ? "buy" : a==="SELL" ? "sell" : a==="TRIM" ? "trim" : a==="WATCH" ? "watch" : a==="HOLD" ? "hold" : "none";
  return `<span class="pill ${c}">${esc(a||"—")}</span>`;
}
function feedItems(arr, tag){ return (arr||[]).map(n => ({ id:n.id || n.url || n.headline, headline:n.headline||"(untitled)", t:typeof n.t === "number" ? n.t : parseTs(n.ts||n.timestamp), source:n.source||"", url:n.url||"", text:String(n.text||""), tag:n.tag||tag })); }
function coNews(h){ return (S.co[h.id] && S.co[h.id].length) ? S.co[h.id] : feedItems(S.feed?.company?.[h.label], h.label); }
function mktNews(){ const live = [...(S.mkt.global||[]), ...(S.mkt.brazil||[])]; return live.length ? live : feedItems(S.feed?.market, "Markets"); }
function allNews(){
  const seen = new Set(), list = [];
  const push = arr => { for (const n of arr||[]) { if (!n.id || seen.has(n.id)) continue; seen.add(n.id); list.push(n); } };
  for (const h of (S.holdings||[])) push(coNews(h));
  push(mktNews());
  return list;
}

/* ---------- live data ---------- */
function watch(key, server, tool, input, onData, onErr, every = REFRESH){
  if (!mcp || watches.has(key)) return;
  const un = mcp.watchTool(server, tool, input, ev => {
    if (ev.type === "data") { S.lastData = Math.max(S.lastData, stamp(ev.result)); onData(ev.result); }
    else onErr(ev.error);
    render();
  }, { refetchInterval: every, cache: { staleTime: every - 60*1000, gcTime: every * 4 } });
  watches.set(key, un);
}
function drop(prefix, keep){ for (const [k, un] of watches) if (k.startsWith(prefix) && !keep.has(k)) { un(); watches.delete(k); } }
const MKT = {
  global: { search_mode:"smart", query:{ text:"Latest global financial markets news today: stocks, interest rates, currencies and commodities", max_chunks:20 } },
  brazil: { search_mode:"smart", query:{ text:"Latest news about the Brazilian stock market, Ibovespa and the real today", max_chunks:15 } }
};

function syncWatches(){
  if (!mcp) return;
  for (const k of Object.keys(MKT)) watch("m:"+k, BD, "bigdata_search", { request: MKT[k] },
    r => { S.mkt[k] = parseNews(r.payload, k==="brazil" ? "Brazil" : "Markets"); delete S.mktErr[k]; },
    e => { S.mktErr[k] = e; if (AUTH_CODES.includes(e.code)) S.mkt[k] = []; });

  const hs = S.holdings || [];
  const ids = [...new Set(hs.map(h => h.rpId).filter(Boolean))].sort();
  const tk = "t:" + ids.join(",");
  drop("t:", new Set(ids.length ? [tk] : []));
  if (ids.length) watch(tk, BD, "bigdata_portfolio_tearsheet",
    { rp_entity_ids: ids, metrics:["PRICE","PRICE_CHANGE_1D","EPS_SURPRISE","PRICE_TARGET","SENTIMENT"] },
    r => { S.tear = parseTear(r.payload); S.tearErr = null; S.tearAt = stamp(r); setTimeout(syncWatches, 0); },
    e => { S.tearErr = e; setTimeout(syncWatches, 0); });

  const tearReady = !ids.length || S.tearAt || S.tearErr;
  const keepQ = new Set(), keepT = new Set(), keepN = new Set(), keepC = new Set();
  for (const h of hs) {
    const needAV = !bdRow(h) || !!S.tearErr;
    const qk = "q:"+h.symbol;
    if (needAV && tearReady) { keepQ.add(qk); queueJob(qk, () => watchAV(h, qk)); }
    // Twelve Data steps in when Alpha Vantage has failed and Bigdata.com has no exact quote.
    const tdk = "d:"+h.symbol;
    const avFailed = S.quoteErr[h.symbol] && !S.quotes[h.symbol];
    if (needAV && avFailed && !S.tdErr[h.symbol]?.plan) { keepT.add(tdk); queueJob(tdk, () => watchTD(h, tdk)); }

    const name = h.name || h.label;
    const nk = "n:"+h.id+":"+name; keepN.add(nk);
    watch(nk, BD, "bigdata_search", { request:{ search_mode:"smart", query:{ text:`Latest news about ${name} (${h.label}) this week`, max_chunks:8 } } },
      r => { S.co[h.id] = parseNews(r.payload, h.label); delete S.coErr[h.id]; },
      e => { S.coErr[h.id] = e; });
    const ck = "c:"+h.id+":"+name; keepC.add(ck);
    watch(ck, BD, "bigdata_search", { request:{ search_mode:"smart", query:{ text:`${name} latest earnings call and filings: management commentary on results, guidance, capital allocation and risks`, max_chunks:6 } } },
      r => { S.calls[h.id] = parseNews(r.payload, h.label); delete S.callsErr[h.id]; },
      e => { S.callsErr[h.id] = e; }, SLOW);
  }
  drop("q:", keepQ); drop("d:", keepT); drop("n:", keepN); drop("c:", keepC);
  for (const k of [...queued]) if ((k.startsWith("q:") && !keepQ.has(k)) || (k.startsWith("d:") && !keepT.has(k))) queued.delete(k);
  ensureIds();
}
function watchAV(h, qk){
  watch(qk, AV, "GLOBAL_QUOTE", { symbol:h.symbol, datatype:"json" },
    r => { const q = parseQuote(r.payload); if (q.err) S.quoteErr[h.symbol] = { msg:q.err, limited:q.limited }; else { S.quotes[h.symbol] = q; delete S.quoteErr[h.symbol]; } setTimeout(syncWatches, 0); },
    e => { S.quoteErr[h.symbol] = { msg:errCopy(e, AV), e }; if (AUTH_CODES.includes(e.code)) delete S.quotes[h.symbol]; setTimeout(syncWatches, 0); }, SLOW);
}
function watchTD(h, tdk){
  const input = h.currency === "BRL" ? { symbol:h.label, mic_code:"BVMF" } : { symbol:h.label };
  watch(tdk, TD, "get_quote", input,
    r => { const q = parseTD(r.payload); if (q.err) { S.tdErr[h.symbol] = { msg:q.err, plan:q.plan }; if (q.plan) { const un = watches.get(tdk); if (un) { un(); watches.delete(tdk); } } } else { S.td[h.symbol] = q; delete S.tdErr[h.symbol]; } },
    e => { S.tdErr[h.symbol] = { msg:errCopy(e, TD), e }; });
}
/* Space out per-symbol quote calls so free plans don't refuse a burst. */
const queued = new Set(), jobs = []; let pump = null;
function queueJob(key, fn){
  if (watches.has(key) || queued.has(key)) return;
  queued.add(key);
  jobs.push(() => { if (!queued.has(key)) return false; queued.delete(key); fn(); return true; });
  if (!pump) runJobs();
}
function runJobs(){ let ran = false; while (jobs.length && !ran) ran = jobs.shift()(); pump = jobs.length ? setTimeout(runJobs, 13000) : null; }

const resolving = new Set();
async function ensureIds(){
  if (!mcp || !holdCol) return;
  for (const h of (S.holdings||[])) {
    if (h.rpId || h.rpLookupFailed || resolving.has(h.id)) continue;
    resolving.add(h.id);
    const ent = await resolveEntity(h.name, h.label, h.currency === "BRL" ? "B3" : "US");
    try { await holdCol.doc(h.id).update(ent ? { rpId:ent.rpId } : { rpLookupFailed:true }); } catch {}
    resolving.delete(h.id);
  }
}
async function resolveEntity(name, ticker, ex){
  if (!mcp) return null;
  try {
    const ids = ex === "B3" ? ["BVMF:"+ticker] : ["XNAS:"+ticker, "XNYS:"+ticker];
    const res = await mcp.callTool(BD, "get_securities", { market_identifiers: ids });
    const hit = Object.values(asObj(res.payload).results || {}).find(r => r && r.id && r.security_type === "COMPANY");
    if (hit) return { rpId:hit.id };
  } catch {}
  try {
    const res = await mcp.callTool(BD, "find_securities", ex==="B3" ? { query:name, countries:["BR"] } : { query:ticker });
    let p = asObj(res.payload); if (Array.isArray(p)) p = p[0] || {};
    const list = (p.results || []).filter(r => r.security_type === "COMPANY");
    const hit = list.find(r => (r.listing_values||[]).some(l => l.endsWith(":"+ticker)));
    return hit ? { rpId:hit.id } : null;
  } catch { return null; }
}

/* ---------- research pack: statements + earnings calls ---------- */
const qKey = x => x.fiscal_year*10 + (+String(x.fiscal_period).replace(/\D/g,"") || 0);
function dfMarkdown(f, label, name){
  const sortD = a => [...(a||[])].filter(x => /Q\d/.test(x.fiscal_period||"")).sort((x,y) => qKey(y) - qKey(x));
  const I = sortD(f.income_statement), B = sortD(f.balance_sheet), C = sortD(f.cash_flow);
  if (!I.length) return null;
  const q = I.slice(0, 4);
  const at = (arr, p) => arr.find(x => qKey(x) === qKey(p)) || {};
  const prevYear = p => I.find(x => x.fiscal_year === p.fiscal_year - 1 && x.fiscal_period === p.fiscal_period);
  const ltm = p => { const i = I.findIndex(x => qKey(x) === qKey(p)); const s = I.slice(i, i+4); return s.length === 4 ? s.reduce((a,x) => a + (x.ebitda||0), 0) : null; };
  const m = v => (v==null || !isFinite(v)) ? "—" : (v/1e6).toLocaleString("en-US", { maximumFractionDigits:0 });
  const pc = v => (v==null || !isFinite(v)) ? "—" : (v*100).toFixed(1) + "%";
  const cols = q.map(p => `${String(p.fiscal_period).replace(/\D/g,"")}Q${String(p.fiscal_year).slice(2)}`);
  const row = (label, fn) => `| ${label} | ${q.map(p => { try { return fn(p); } catch { return "—"; } }).join(" | ")} |`;
  const lines = [
    `${label} (${name||""}) — quarterly financial statements, ${f.currency||""} millions`,
    `Source: Bigdata.com corporate fundamentals (${f.source?.provider_id||"data provider"}). Standardised figures; the company's release may report adjusted EBITDA or recurring net income that differ.`,
    "",
    `| Line | ${cols.join(" | ")} |`,
    `|---|${cols.map(() => "---:").join("|")}|`,
    row("Revenue", p => m(p.revenue)),
    row("Revenue YoY", p => { const y = prevYear(p); return y && y.revenue ? pc(p.revenue/y.revenue - 1) : "—"; }),
    row("Gross profit", p => m(p.gross_profit)),
    row("Gross margin", p => pc(p.gross_profit/p.revenue)),
    row("EBITDA", p => m(p.ebitda)),
    row("EBITDA margin", p => pc(p.ebitda/p.revenue)),
    row("EBIT", p => m(p.operating_income)),
    row("Net financial result", p => m(p.net_interest_income)),
    row("Pre-tax income", p => m(p.income_before_tax)),
    row("Net income", p => m(p.net_income)),
    row("Net margin", p => pc(p.net_income/p.revenue)),
    row("EPS", p => p.eps==null ? "—" : (+p.eps).toFixed(3)),
    row("Cash + ST investments", p => m(at(B,p).cash_and_short_term_investments)),
    row("Total debt", p => m(at(B,p).total_debt)),
    row("Net debt", p => m(at(B,p).net_debt)),
    row("Equity (parent)", p => m(at(B,p).total_stockholders_equity)),
    row("LTM EBITDA", p => m(ltm(p))),
    row("Net debt / LTM EBITDA", p => { const l = ltm(p), nd = at(B,p).net_debt; return l && nd!=null ? (nd/l).toFixed(2) + "x" : "—"; }),
    row("Operating cash flow", p => m(at(C,p).operating_cash_flow)),
    row("Capex", p => m(at(C,p).capex)),
    row("Free cash flow", p => m(at(C,p).free_cash_flow)),
    row("Working-capital change", p => m(at(C,p).change_in_working_capital)),
    row("Dividends paid", p => m(at(C,p).common_dividends_paid ?? at(C,p).net_dividends_paid)),
    row("Buybacks", p => m(at(C,p).common_stock_repurchased))
  ];
  return { text: lines.join("\n"), periods: q.map(p => ({ fy:p.fiscal_year, q:+String(p.fiscal_period).replace(/\D/g,"") })) };
}

async function buildPack(){
  if (!mcp || !repCol || S.pack.busy) return;
  packCtl = { stop:false };
  S.pack = { busy:true, msg:"Starting…", log:[] }; render();
  const hs = S.holdings || [];
  for (let i = 0; i < hs.length; i++) {
    const h = hs[i];
    if (packCtl.stop) break;
    if (!h.rpId) { S.pack.log.push(`${h.label}: company not identified`); continue; }
    const tag = `${h.label} (${i+1}/${hs.length})`;
    S.pack.msg = `${tag}: financial statements…`; render();
    let periods = null, note = "";
    try {
      const r = await mcp.callTool(BD, "bigdata_company_tearsheet", { rp_entity_id:h.rpId, company_type:"Public", sections:["financial_statements"], interval:"quarter" });
      const f = asObj(r.payload).fundamentals || {};
      const md = dfMarkdown(f, h.label, h.name);
      if (md) {
        periods = md.periods;
        await repCol.doc("dfs-" + safeId(h.label)).set({ title:`${h.label} financial statements, last 4 quarters`, publisher:"Bigdata.com fundamentals", date:isoDay(Date.now()), symbols:[h.label], kind:"dfs", text:md.text, chars:md.text.length, addedAt:Date.now() });
      } else note = "no statements from the data provider";
    } catch (e) { note = "statements unavailable"; }
    const cands = periods || [{fy:2026,q:3},{fy:2026,q:2},{fy:2026,q:1},{fy:2025,q:4},{fy:2025,q:3}];
    let found = 0;
    for (const p of cands) {
      if (found >= 4 || packCtl.stop) break;
      S.pack.msg = `${tag}: ${p.q}Q${String(p.fy).slice(2)} earnings call…`; render();
      try {
        const r = await mcp.callTool(BD, "bigdata_search", { request:{ search_mode:"fast", query:{
          text:"quarterly results, revenue, margins, cash flow, leverage, capital allocation, guidance and outlook", max_chunks:14,
          filters:{ reporting_entities:[h.rpId], reporting_periods:[{ fiscal_year:p.fy, fiscal_quarter:p.q }], document_type:{ mode:"INCLUDE", values:[{ type:"TRANSCRIPT", subtypes:["EARNINGS_CALL"] }] } } } } });
        const res = asObj(r.payload).results || [];
        if (res.length) {
          const d = res[0];
          const chunks = res.filter(x => x.id === d.id).flatMap(x => x.chunks || []).sort((a,b) => (a.cnum||0) - (b.cnum||0));
          const text = chunks.map(c => c.text).join("\n\n");
          if (text.length > 200) {
            await repCol.doc(`call-${safeId(h.label)}-${p.fy}Q${p.q}`).set({ title:d.headline || `${h.label} ${p.q}Q${p.fy} earnings call`, publisher:d.source?.name || "Earnings call", date:String(d.timestamp||"").slice(0,10), symbols:[h.label], kind:"call", period:`${p.q}Q${String(p.fy).slice(2)}`, url:d.url || "", text, chars:text.length, addedAt:Date.now() });
            found++;
          }
        }
      } catch {}
      await sleep(300);
    }
    S.pack.log.push(`${h.label}: ${note ? note + ", " : "statements, "}${found} call${found===1?"":"s"}`);
  }
  S.pack.busy = false; S.pack.msg = (packCtl.stop ? "Stopped. " : "Done. ") + S.pack.log.join(" · "); render();
}

function diCompact(){
  const m = S.macro; if (!m || !Array.isArray(m.di) || !m.di.length) return "DI curve: not available.";
  const pick = m.di.filter(x => /F\d\d$/.test(x.c));
  const prev = Object.fromEntries((m.prev||[]).map(x => [x.c, x.r]));
  return `Brazil DI futures curve (B3 settlement, ${m.date}; % a.a.): ${pick.map(x => `${x.c.replace("DI1","")} ${(+x.r).toFixed(2)}${prev[x.c]!=null ? ` (${((x.r-prev[x.c])*100).toFixed(0)} bp d/d)` : ""}`).join(", ")}. Selic ${m.selic}%. ${m.notes||""}`;
}
function memoryCompact(){
  const mm = S.memory;
  const lines = [];
  if (mm?.investorProfile) lines.push(`Investor profile you built: ${mm.investorProfile}`);
  if (mm?.lessons?.length) lines.push("Lessons you recorded:\n" + mm.lessons.map((l,i) => `${i+1}. ${l}`).join("\n"));
  const sc = scorecard();
  if (sc.list.length) {
    lines.push(`Track record of your earlier calls (price at the call → now): ${sc.scored ? `${sc.hits}/${sc.scored} directional calls right` : "no directional calls old enough yet"}.`);
    lines.push(sc.list.slice(0, 30).map(x => `${isoDay(x.ranAt)} ${x.symbol} ${x.action}: ${x.ret>0?"+":""}${x.ret.toFixed(1)}% over ${x.days}d${x.hit===true?" ✓":x.hit===false?" ✗":""}`).join("; "));
  }
  const fb = [];
  for (const h of S.history.slice(0, 6)) for (const [sym, f] of Object.entries(h.feedback||{})) fb.push(`${isoDay(h.ranAt)} ${sym}: investor ${f.v === "agree" ? "agreed" : "disagreed"}${f.note ? ` — "${String(f.note).slice(0,240)}"` : ""}`);
  if (fb.length) lines.push("Investor feedback on your calls:\n" + fb.join("\n"));
  return lines.join("\n") || "No memory yet: this is your first session.";
}
function scorecard(){
  const pxNow = {}; for (const r of rows()) if (r.px) pxNow[r.h.label] = r.px.price;
  const list = [];
  for (const run of S.history) {
    const days = (Date.now() - run.ranAt) / 864e5;
    if (days < 3) continue;
    for (const c of (run.calls||[])) {
      const p0 = +c.price, p1 = pxNow[c.symbol];
      if (!p0 || !p1) continue;
      const ret = (p1/p0 - 1) * 100, a = String(c.action||"").toUpperCase();
      const hit = a.startsWith("BUY") ? ret > 0 : (a === "SELL" || a === "TRIM") ? ret < 0 : null;
      list.push({ ranAt:run.ranAt, symbol:c.symbol, action:a, ret, hit, days:Math.round(days), fb:run.feedback?.[c.symbol] });
    }
  }
  const scored = list.filter(x => x.hit !== null);
  return { list, scored:scored.length, hits:scored.filter(x => x.hit).length };
}

function diChart(){
  const m = S.macro; if (!m || !Array.isArray(m.di) || m.di.length < 3) return "";
  const pts = m.di.map(x => ({ c:x.c, r:+x.r, t:(Date.parse(x.m + "-01") - Date.parse(m.date)) / (365.25*864e5) })).filter(p => isFinite(p.t) && isFinite(p.r)).sort((a,b) => a.t - b.t);
  const W = 640, H = 230, L = 44, R = 14, T = 16, B = 34;
  const lo = Math.floor(Math.min(...pts.map(p=>p.r)) * 4) / 4 - 0.25, hi = Math.ceil(Math.max(...pts.map(p=>p.r)) * 4) / 4 + 0.25;
  const tmax = Math.ceil(Math.max(...pts.map(p=>p.t)));
  const x = t => L + (t / tmax) * (W - L - R), y = r => T + (hi - r) / (hi - lo) * (H - T - B);
  const yTicks = []; for (let v = Math.ceil(lo*2)/2; v <= hi + 1e-9; v += 0.5) yTicks.push(v);
  const xTicks = []; for (let v = 0; v <= tmax; v += (tmax > 10 ? 2 : 1)) xTicks.push(v);
  const path = pts.map((p,i) => `${i?"L":"M"}${x(p.t).toFixed(1)},${y(p.r).toFixed(1)}`).join("");
  const area = path + `L${x(pts[pts.length-1].t).toFixed(1)},${(H-B)}L${x(pts[0].t).toFixed(1)},${(H-B)}Z`;
  const selicY = y(+m.selic);
  const labels = pts.filter(p => /F(27|29|31|33|36|41)$/.test(p.c));
  return `<svg class="di" viewBox="0 0 ${W} ${H}" role="img" aria-label="DI futures curve">
    ${yTicks.map(v => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="g"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="t">${v.toFixed(1)}</text>`).join("")}
    ${xTicks.map(v => `<text x="${x(v)}" y="${H-B+16}" text-anchor="middle" class="t">${v}y</text>`).join("")}
    ${isFinite(selicY) && selicY > T && selicY < H-B ? `<line x1="${L}" x2="${W-R}" y1="${selicY}" y2="${selicY}" class="selic"/><text x="${W-R}" y="${selicY-5}" text-anchor="end" class="t">Selic ${m.selic}%</text>` : ""}
    <path d="${area}" class="a"/><path d="${path}" class="l"/>
    ${labels.map(p => `<circle cx="${x(p.t)}" cy="${y(p.r)}" r="3.5" class="p"/><text x="${x(p.t)}" y="${y(p.r)-9}" text-anchor="middle" class="t b">${p.c.replace("DI1","")} ${p.r.toFixed(2)}</text>`).join("")}
  </svg>`;
}

/* ---------- deep dive: one company, scenarios ---------- */
function companyMaterial(h, budget){
  const reps = (S.reports||[]).filter(r => (r.symbols||[]).includes(h.label));
  const dfs = reps.find(r => r.kind === "dfs");
  const calls = reps.filter(r => r.kind === "call").sort((a,b) => String(b.id).localeCompare(String(a.id)));
  const rels = reps.filter(r => r.kind === "release").sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));
  const lets = reps.filter(r => r.kind === "letter" || r.kind === "article").sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));
  const ups = reps.filter(r => !["dfs","call","release","letter","article"].includes(r.kind)).sort((a,b) => (b.addedAt||0) - (a.addedAt||0));
  return { dfs, calls, rels, lets, ups };
}

    else block.push("Company news: none found this week.");
    const cc = (S.calls[h.id]||[]).slice(0,4);
    if (cc.length) { block.push("Earnings calls / filings:"); for (const x of cc) { const k = addRef("T", { kind:"call", id:x.id, title:x.headline, url:x.url, source:x.source }); block.push(`[${k}] ${x.source}, ${isoDay(x.t)}: ${x.headline} — ${x.text.slice(0,600)}`); } }

    for (const x of lets.slice(0,2)) { const k = addRef("R", { kind:"report", id:x.id, title:x.title, source:x.publisher }); block.push(`[${k}] ${x.kind === "letter" ? "Fund-manager letter" : "Article"}: "${x.title}" by ${x.publisher||"unknown"}, ${x.date||"undated"} (id=${x.id}):\n${String(x.text||"").slice(0,1600)}`); }
    if (rels[0]) { const x = rels[0]; const k = addRef("R", { kind:"report", id:x.id, title:x.title, source:x.publisher }); block.push(`[${k}] Latest earnings release ${x.period||""} (id=${x.id}; older releases via read_report: ${rels.slice(1).map(r=>r.id).join(", ")||"none"}):\n${String(x.text).slice(0,1800)}`); }

  const totals = {}; for (const r of R) { const c = r.h.currency; totals[c] = (totals[c]||0) + (r.value||0); }

  const prompt = `You are the agent on an individual investor's market desk: a rigorous, balanced equity analyst who has read everything below. The investor is a young finance professional in São Paulo who wants a fair hearing of both sides and then to be challenged, not reassured. Your job is to analyse the releases, statements, earnings calls, fund-manager letters, articles and news on every company he owns, compare them with his own notes, lay out the strongest case for and against each position, and then tell him what you think — including what he does not want to hear.

function agentTools(say){
  say = say || (msg => { S.progress = msg; render(); });
  const tools = [
    { name:"search_bigdata",
      description:"Search Bigdata.com news, earnings-call transcripts and filings for one specific question. Returns up to 5 results with source, date, headline and excerpt.",
      inputSchema:{ type:"object", properties:{ query:{ type:"string", description:"A natural-language question naming the company and one aspect, e.g. 'Lojas Renner Q3 2026 gross margin and inventory'" } }, required:["query"] },
      execute: async (input, ctx) => {
        const q = String(input.query||"").slice(0,400); if (!q) throw new Error("query is required");
        say(`Searching: ${q}`);
        const r = await mcp.callTool(BD, "bigdata_search", { request:{ search_mode:"smart", query:{ text:q, max_chunks:6 } } }, { signal:ctx.signal });
        return parseNews(r.payload, "search").slice(0,5).map(x => ({ source:x.source, date:isoDay(x.t), headline:x.headline, excerpt:x.text.slice(0,900) }));
      } },
    { name:"company_fundamentals",
      description:"Get ratios, key metrics, analyst ratings, latest earnings, earnings calendar and dividends for one of the investor's positions. Returns a text excerpt.",
      inputSchema:{ type:"object", properties:{ symbol:{ type:"string", description:"Position symbol exactly as listed, e.g. KLBN11" } }, required:["symbol"] },
      execute: async (input, ctx) => {
        const h = (S.holdings||[]).find(x => x.label === String(input.symbol||"").toUpperCase());
        if (!h || !h.rpId) throw new Error("No fundamentals available for that symbol");
        say(`Pulling fundamentals for ${h.label}`);
        const r = await mcp.callTool(BD, "bigdata_company_tearsheet", { rp_entity_id:h.rpId, company_type:"Public", sections:["financial_ratios","key_metrics","analyst_ratings","latest_earnings","earnings_calendar","dividends"] }, { signal:ctx.signal });
        const p = r.payload; const txt = typeof p === "string" ? p : JSON.stringify(p);
        return txt.slice(0, 7000);
      } }
  ];
  if ((S.reports||[]).length) tools.push({ name:"read_report",
    description:"Read more of a research report the investor uploaded. Returns up to 6000 characters starting at offset.",
    inputSchema:{ type:"object", properties:{ id:{ type:"string", description:"Report id from the prompt" }, offset:{ type:"number", description:"Character offset to start from" } }, required:["id"] },
    execute: (input) => {
      const r = (S.reports||[]).find(x => x.id === String(input.id));
      if (!r) throw new Error("Unknown report id");
      const off = Math.max(0, Number(input.offset)||0);
      say(`Reading “${r.title}”`);
      return { title:r.title, offset:off, total:r.chars, text:String(r.text||"").slice(off, off+6000) };
    } });
  return tools;
}

  const dataAsOf = S.lastData || Date.now();

    const { prompt, refs } = buildPrompt();
    const lim = await sample.limits().catch(() => null);
    const opts = { modelTier:"complex", signal:agentCtl.signal, onText:() => { if (!/Writing/.test(S.progress)) { S.progress = "Writing the briefing…"; render(); } } };
    if (lim?.tools && mcp) opts.tools = agentTools(); else opts.cache = false;
    const res = await sample.json(prompt, opts);
    if (!res || !Array.isArray(res.signals)) throw { code:"invalid_json" };
    const okRef = k => typeof k === "string" && refs[k];
    const doc = {
      marketView:String(res.marketView||""), riskLevel:String(res.riskLevel||""),
      portfolioCritique:String(res.portfolioCritique||""), ratesView:String(res.ratesView||""), strengths:String(res.strengths||""), source:"page",
      provocations:(Array.isArray(res.provocations)?res.provocations:[]).map(String).slice(0,6),
      signals:res.signals.slice(0,40).map(s => ({
        symbol:String(s.symbol||""), action:String(s.action||""), confidence:String(s.confidence||""), headline:String(s.headline||""),
        bullCase:String(s.bullCase||""), bearCase:String(s.bearCase||""), managerViews:String(s.managerViews||""),
        newsTake:String(s.newsTake||""), researchTake:String(s.researchTake||""), critique:String(s.critique||""), provocation:String(s.provocation||""),
        researchCheck:String(s.researchCheck||""), watch:String(s.watch||""), refs:(Array.isArray(s.refs)?s.refs:[]).filter(okRef).slice(0,8)
      })),
      refs:Object.fromEntries(Object.entries(refs).filter(([k]) => res.signals.some(s => (s.refs||[]).includes(k)))),
      ranAt:Date.now(), dataAsOf
    };
    S.agent = doc;
    if (agentRef) { try { await agentRef.set(doc); } catch {} }

    if (h.stop && h.target && r.px) {
      const lo = +h.stop, hi = +h.target, pos = Math.max(0, Math.min(100, (r.px.price - lo) / (hi - lo) * 100));
      rng = `<span class="range" title="Stop ${fmtNum(lo)} → target ${fmtNum(hi)}"><span class="track"><span class="pin" style="left:${pos}%"></span></span><span class="ends"><span>${fmtNum(lo)}</span><span>${fmtNum(hi)}</span></span></span>`;
    } else if (h.target || h.stop) rng = `<span class="num sub">${h.stop?"stop "+fmtNum(+h.stop):""}${h.stop&&h.target?" · ":""}${h.target?"tgt "+fmtNum(+h.target):""}</span>`;
    const street = t && t.price_target?.value!=null
      ? `<span class="num">${fmtMoney(t.price_target.value, t.price_target.currency)}</span><span class="sub">${esc(t.ticker||"")}${t.sentiment?.value!=null?` · sent ${t.sentiment.value>0?"+":""}${(+t.sentiment.value).toFixed(2)}`:""}</span>`
      : `<span class="muted">—</span>`;
    const failed = S.quoteErr[h.symbol] && !S.td[h.symbol] && !S.backup[h.label];
    const pxCell = r.px ? `<span class="num">${fmtMoney(r.px.price, h.currency)}</span><span class="sub">${esc(r.px.src)}${r.px.day?" · "+esc(r.px.day):""}</span>`
      : failed ? `<span class="muted">unavailable</span><span class="sub">all sources refused</span>` : `<span class="muted">loading…</span>`;
    let html = `<tr class="row ${open?"open":""}" data-id="${esc(h.id)}" tabindex="0" aria-expanded="${open}">
      <td><div class="tk"><b><i class="cdot" style="background:${colorFor(h.label)}"></i>${esc(h.label)}</b><span>${esc(h.name||"")}</span></div></td>
      <td>${pxCell}</td>
      <td>${r.px && isFinite(r.px.chgPct) ? `<span class="chg ${cls(r.px.chgPct)}">${fmtPct(r.px.chgPct)}</span>` : "—"}</td>
      <td><span class="num">${fmtNum(r.shares,0)}</span><span class="sub num">@ ${fmtMoney(r.avg,h.currency)}</span></td>
      <td><span class="num">${fmtMoney(r.value,h.currency)}</span></td>
      <td>${W[h.label]!=null ? `<span class="wt"><span class="num">${W[h.label].toFixed(1)}%</span><span class="wbar"><span style="width:${Math.min(100, W[h.label]*2.5)}%;background:${colorFor(h.label)}"></span></span></span>` : "—"}</td>
      <td><span class="num ${cls(r.pnl)}">${r.pnl==null?"—":(r.pnl>0?"+":"")+fmtMoney(r.pnl,h.currency)}</span><span class="sub num ${cls(r.pnlPct)}">${fmtPct(r.pnlPct)}</span></td>
      <td>${rng}</td>
      <td>${street}</td>
      <td>${sig ? pillFor(sig.action) : `<span class="pill none">${S.agentBusy?"…":"—"}</span>`}</td>
    </tr>`;
    if (open) html += `<tr class="detail"><td colspan="10">${renderDetail(r, sig, t)}</td></tr>`;
    return html;
  }).join("");
  const cards = R.map(r => {
    const h = r.h, open = S.open === h.id, sig = signalFor(h.label), t = h.rpId && S.tear[h.rpId];
    return `<div class="pcard ${open?"open":""}" data-id="${esc(h.id)}" tabindex="0" role="button" aria-expanded="${open}">
      <div class="pc-top"><div class="tk"><b><i class="cdot" style="background:${colorFor(h.label)}"></i>${esc(h.label)}</b><span>${esc(h.name||"")}</span></div>${sig ? pillFor(sig.action) : ""}</div>
      <div class="pc-grid">
        <div><span class="label">Last</span><span class="num">${r.px ? fmtMoney(r.px.price, h.currency) : "—"}</span>${r.px && isFinite(r.px.chgPct) ? `<span class="chg ${cls(r.px.chgPct)}">${fmtPct(r.px.chgPct)}</span>` : ""}</div>
        <div><span class="label">Value</span><span class="num">${fmtMoney(r.value, h.currency)}</span><span class="sub num">${fmtNum(r.shares,0)} @ ${fmtMoney(r.avg,h.currency)}</span></div>
        <div><span class="label">Unrealized</span><span class="num ${cls(r.pnl)}">${fmtPct(r.pnlPct)}</span><span class="sub num ${cls(r.pnl)}">${r.pnl==null?"":(r.pnl>0?"+":"")+fmtMoney(r.pnl,h.currency)}</span></div>
      </div>
      ${r.px ? `<span class="sub">${esc(r.px.src)} · ${esc(r.px.day)}</span>` : ""}
    </div>${open ? `<div class="pc-detail">${renderDetail(r, sig, t)}</div>` : ""}`;
  }).join("");
  return `<div class="pf-cards">${cards}</div><div class="tablewrap pf-t"><table class="pf"><thead><tr><th>Position</th><th>Last</th><th>Day</th><th>Qty · avg</th><th>Value</th><th>Weight</th><th>Unrealized</th><th>Stop → target</th><th>Street target</th><th>Agent</th></tr></thead><tbody>${body}</tbody></table></div>
  <p class="muted" style="margin:0;font-size:12px">Prices: Bigdata.com when it quotes the exact share class, then Alpha Vantage, then Twelve Data, plus an hourly backup feed (brapi.dev) written by a scheduled task, so every position always has a quote; the freshest source wins and each row shows its source and trading day. Quotes are delayed about 15 minutes. Street targets for dual‑listed companies may refer to the US ADR, shown with its own ticker.</p>`;
}

function renderDetail(r, sig, t){

  const ce = S.coErr[h.id];
  const del = S.confirmDel === h.id
    ? `<button class="btn sm danger" data-act="del-yes" data-id="${esc(h.id)}">Confirm remove</button><button class="btn sm ghost" data-act="del-no">Keep</button>`
    : `<button class="btn sm ghost" data-act="del" data-id="${esc(h.id)}">Remove</button>`;
  const reps = reportsFor(h.label);
  return `<div class="detail-grid">
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <div><h4>Your notes</h4>
        <textarea class="notes" id="notes-${esc(h.id)}" placeholder="Your thesis, catalysts you're waiting for, what would make you sell…">${esc(h.research||"")}</textarea>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">
          <button class="btn sm primary" data-act="save-notes" data-id="${esc(h.id)}">Save notes</button>
          <button class="btn sm" data-act="edit" data-id="${esc(h.id)}">Edit position</button>
          ${del}
          <span class="muted" id="notes-msg-${esc(h.id)}" style="font-size:12px"></span>
        </div>
      </div>
      ${sig ? `<div><h4>Agent on ${esc(h.label)}</h4><p style="margin:0 0 6px">${pillFor(sig.action)} <b>${esc(sig.headline)}</b></p>${sig.critique?`<p style="margin:0;color:var(--ink-2)">${esc(sig.critique)}</p>`:""}${sig.provocation?`<p style="margin:8px 0 0;font-style:italic">“${esc(sig.provocation)}”</p>`:""}<button class="btn sm ghost" data-goto="agent" style="margin-top:6px;padding-left:0">Full briefing →</button></div>` : ""}
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <div><h4>Snapshot</h4><dl class="kv">
        <dt>Symbol</dt><dd>${esc(h.symbol)} · ${esc(h.currency)}</dd>
        <dt>Cost basis</dt><dd>${fmtMoney(r.cost,h.currency)}</dd>
        ${r.px?`<dt>Price source</dt><dd>${esc(r.px.src)} · ${esc(r.px.day)}</dd>`:""}
        ${t?.price_target?.value!=null?`<dt>Street range</dt><dd>${fmtNum(t.price_target.low)} – ${fmtNum(t.price_target.high)} ${esc(t.price_target.currency||"")} (${esc(t.ticker||"")})</dd>`:""}
        ${t?.eps?.surprise!=null?`<dt>Last EPS surprise</dt><dd class="${cls(+t.eps.surprise)}">${fmtPct(+t.eps.surprise)}</dd>`:""}
        <dt>Research on file</dt><dd>${reps.length} report${reps.length===1?"":"s"} · ${(S.calls[h.id]||[]).length} call/filing excerpts</dd>
        ${S.quoteErr[h.symbol]?`<dt>Alpha Vantage</dt><dd style="white-space:normal">${esc(S.quoteErr[h.symbol].msg.slice(0,140))}</dd>`:""}
        ${S.tdErr[h.symbol]?`<dt>Twelve Data</dt><dd style="white-space:normal">${esc(S.tdErr[h.symbol].msg.slice(0,140))}</dd>`:""}
      </dl></div>
      <div><h4>Latest on ${esc(h.name||h.label)}</h4>
        ${news.length ? `<ul class="mini-news">${news.map(n=>`<li><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.headline)}</a><span class="sub">${esc(n.source)} · ${esc(ago(n.t))}</span></li>`).join("")}</ul>`
          : (S.co[h.id] || S.feed) ? `<span class="muted">No company news this week.</span>` : ce ? `<span class="muted">${esc(errCopy(ce, BD))}</span>` : `<span class="muted">Loading news…</span>`}
      </div>
    </div>
  </div>`;
}

function newsHead(){
  const hs = S.holdings || [], f = S.newsFilter;
  const chips = [["all","All"],["markets","Markets"], ...hs.map(h=>[h.label,h.label])]
    .map(([k,l]) => `<button class="chip" data-nf="${esc(k)}" aria-pressed="${f===k}">${esc(l)}</button>`).join("");
  const out = [ratesPanel(), `<div class="bar"><h2>News</h2><span class="sp"></span><span class="muted" style="font-size:12px">Bigdata.com · refreshes every 15 min</span></div><div class="chips">${chips}</div>`];
  const err = (S.mktErr.global || S.mktErr.brazil) && !S.feed ? (S.mktErr.global || S.mktErr.brazil) : null;

  if (err) out.push(`<div class="notice warn"><p>${esc(errCopy(err, BD))}</p>${needsAllow(err)?`<button class="btn sm primary" id="allow">Allow connectors</button>`:""}</div>`);

function newsBody(){
  const f = S.newsFilter;
  const list = allNews().sort((a,b)=>(b.t||0)-(a.t||0)).filter(n => f==="all" ? true : f==="markets" ? (n.tag==="Markets"||n.tag==="Brazil") : n.tag===f);
  const cited = new Set(Object.values(S.agent?.refs||{}).filter(r=>r.kind==="news").map(r=>r.id));
  if (!list.length) {
    const loading = !S.noRuntime && !S.mkt.global && !S.mktErr.global && !S.feed;
    return `<div class="news">${loading ? `<div class="art"><div class="skel" style="width:30%"></div><div class="skel" style="width:85%"></div><div class="skel"></div></div><div class="art"><div class="skel" style="width:25%"></div><div class="skel" style="width:70%"></div></div>` : `<div class="art"><p>No news in this view yet.</p></div>`}</div>`;
  }
  return `<div class="news">${list.slice(0,90).map(n => `<article class="art" id="art-${esc(n.id)}">
    <div class="meta"><span class="tag ${n.tag!=="Markets"&&n.tag!=="Brazil"?"mine":""}">${esc(n.tag)}</span><span>${esc(n.source)}</span><span>·</span><span>${esc(ago(n.t))}</span>${cited.has(n.id)?`<span class="tag mine">cited by agent</span>`:""}</div>
    <h3>${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.headline)}</a>`:esc(n.headline)}</h3>
    ${n.text?`<p>${esc(n.text.slice(0,420))}</p>`:""}
  </article>`).join("")}</div>`;
}

function reportForm(){
  const hs = S.holdings || [];
  return `<form class="pos" id="repform" novalidate>
    <div class="fld half"><label class="label" for="r-title">Title</label><input id="r-title" placeholder="Klabin 3Q26 review" autocomplete="off"></div>
    <div class="fld"><label class="label" for="r-pub">Publisher</label><input id="r-pub" placeholder="BTG Pactual" autocomplete="off"></div>
    <div class="fld"><label class="label" for="r-date">Date</label><input id="r-date" type="date"></div>
    <div class="fld full"><span class="label">Covers</span><div class="checks">
      <label><input type="checkbox" value="ALL" class="r-sym"> Whole portfolio / macro</label>
      ${hs.map(h=>`<label><input type="checkbox" value="${esc(h.label)}" class="r-sym"> ${esc(h.label)}</label>`).join("")}
    </div></div>
    <div class="fld half"><label class="label" for="r-file">File (PDF, TXT or MD)</label><input id="r-file" type="file" accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown"><span class="hint">Text is extracted in your browser and saved privately to your account. Scanned PDFs without a text layer can't be read.</span></div>

  </form>`;

function researchBody(){
  const out = [];
  const kindOrder = { release:0, dfs:1, call:2, letter:3, article:4 };
  const reps = [...(S.reports||[])].filter(r => S.repFilter === "all" || (r.symbols||[]).includes(S.repFilter))
    .sort((a,b) => String((a.symbols||[])[0]).localeCompare(String((b.symbols||[])[0])) || (kindOrder[a.kind]??2) - (kindOrder[b.kind]??2) || String(b.id).localeCompare(String(a.id)));
  const kindTag = r => r.kind === "letter" ? `<span class="tag">Fund letter</span>` : r.kind === "article" ? `<span class="tag">Article</span>` : r.kind === "release" ? `<span class="tag">Release ${esc(r.period||"")}</span>` : r.kind === "dfs" ? `<span class="tag">Statements</span>` : r.kind === "call" ? `<span class="tag">Earnings call ${esc(r.period||"")}</span>` : `<span class="tag">Report</span>`;
  out.push(`<div class="bar"><h2 style="font-size:15px">Library</h2><span class="muted" style="font-size:12px">${reps.length} file${reps.length===1?"":"s"}</span></div>`);
  if (!reps.length) out.push(`<div class="empty"><h3>Nothing on file yet</h3><p>Pull statements and calls for all positions in one go, then add the releases and broker reports you get as PDFs. Link each upload to the positions it covers so the agent can hold your thesis up against it.</p>${S.noStore?"":`<button class="btn primary" id="rep-add2">Add a report</button>`}</div>`);
  else out.push(`<div class="news">${reps.map(r => `<article class="art" id="rep-${esc(r.id)}">
    <div class="meta">${(r.symbols||[]).map(s=>`<span class="tag mine">${esc(s==="ALL"?"Portfolio":s)}</span>`).join("")}${kindTag(r)}<span>${esc(r.publisher||"Own notes")}</span><span>·</span><span>${esc(r.date||isoDay(r.addedAt))}</span><span>·</span><span class="num">${(r.chars||0).toLocaleString("en-US")} chars</span></div>
    <h3>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</h3>
    ${S.repView===r.id ? `<pre class="doc">${esc(r.text)}</pre>` : `<p>${esc(String(r.text||"").replace(/\|/g," ").slice(0,360))}</p>`}
    <div class="actions"><button class="btn sm" data-act="rep-view" data-id="${esc(r.id)}">${S.repView===r.id?"Collapse":"Read"}</button>${S.repDel===r.id?`<button class="btn sm danger" data-act="rep-del-yes" data-id="${esc(r.id)}">Confirm delete</button><button class="btn sm ghost" data-act="rep-del-no">Keep</button>`:`<button class="btn sm ghost" data-act="rep-del" data-id="${esc(r.id)}">Delete</button>`}</div>
  </article>`).join("")}</div>`);

  out.push(`<div class="bar"><h2 style="font-size:15px">Earnings calls &amp; filings</h2><span class="muted" style="font-size:12px">Bigdata.com · hourly</span></div>`);
  const hs = S.holdings || [];
  const items = [];
  for (const h of hs) for (const c of (S.calls[h.id]||[])) items.push(c);
  if (!items.length) out.push(`<div class="news"><div class="art"><p>${hs.length ? "Loading transcripts and filings…" : "Add positions to pull their earnings calls and filings."}</p></div></div>`);
  else out.push(`<div class="news">${items.sort((a,b)=>(b.t||0)-(a.t||0)).map(n => `<article class="art" id="call-${esc(n.id)}">
    <div class="meta"><span class="tag mine">${esc(n.tag)}</span><span>${esc(n.source)}</span><span>·</span><span>${esc(isoDay(n.t))}</span></div>
    <h3>${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.headline)}</a>`:esc(n.headline)}</h3><p>${esc(n.text.slice(0,420))}</p></article>`).join("")}</div>`);
  return out.join("");
}

/* ---------- render: agent briefing ---------- */
function refButtons(keys){
  const a = S.agent; if (!a || !keys?.length) return "";
  return `<div class="refs">Sources ${keys.map(k => { const r = a.refs?.[k]; return r ? `<button data-ref="${esc(k)}" title="${esc((r.source?r.source+": ":"")+r.title)}">${esc(k)}</button>` : ""; }).join("")}</div>`;
}
function agentHead(){
  const a = S.agent, has = (S.holdings||[]).length;
  const newer = a && S.lastData > (a.dataAsOf||0) + 60000;
  const out = [`<div class="brief-head"><div class="row1"><h2>Desk briefing</h2><span class="sp" style="flex:1"></span>
    ${S.agentBusy ? `<button class="btn sm" id="stop">Stop</button>` : `<button class="btn primary" id="run" ${(!sample||!S.sampleOK||!has)?"disabled":""}>${a?"Run new briefing":"Run briefing"}</button>`}</div>
    <div class="muted" style="font-size:12.5px">${a ? `Last briefing ${esc(ago(a.ranAt))}${a.source==="cloud"?" by the daily cloud run":""}${newer?" · prices or news have changed since then":""}.` : "No briefing yet."} A fresh briefing is written in the cloud every weekday after the close, so it is ready on your phone without running anything. The agent reads market news, every company's news, earnings calls, filings and the reports you uploaded, then argues with your positions. A run takes one to three minutes.</div>
    ${S.agentBusy ? `<div class="progress"><span class="spin"></span><span>${esc(S.progress)}</span></div>` : ""}
    ${agentErrHtml()}
  </div>`];
  return out.join("");
}
function agentErrHtml(){
  if (!S.agentErr) return "";
  const c = S.agentErr.code;
  const msg = c==="not_granted" ? "The agent needs your permission to use Claude on this page. Allow it from the artifact's Permissions menu, then run it again."
    : c==="rate_limited" ? "Claude usage limit reached for now. Try again later."
    : c==="invalid_json" ? "The briefing came back unreadable. Run it again."
    : c==="prompt_too_large" ? "Too much material for one briefing. Delete older reports or shorten notes, then run again."
    : c==="sampling_disabled" ? "Claude isn't available to this page for your account."
    : `The briefing failed (${c||"error"}). Run it again.`;
  return `<div class="notice err"><p>${esc(msg)}</p></div>`;
}
function deepPanel(label){
  const d = S.deep[label];
  if (!d) return "";
  const sc = d.scenarios || [];

  const refBtns = Object.keys(d.refs||{}).length ? `<div class="refs">Sources ${Object.entries(d.refs).map(([k,r]) => `<button data-dref="${esc(label)}|${esc(k)}" title="${esc((r.source?r.source+": ":"")+r.title)}">${esc(k)}</button>`).join("")}</div>` : "";

let pdfReady = null;
function loadPdfJs(){
  if (pdfReady) return pdfReady;
  const add = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.appendChild(s); });
  pdfReady = add("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")
    .then(() => add("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"))
    .then(() => window.pdfjsLib)
    .catch(e => { pdfReady = null; throw e; });
  return pdfReady;
}
async function extractPdf(file, onPage){
  const lib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported:false }).promise;
  const parts = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    parts.push(tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join(""));
    onPage && onPage(i, pdf.numPages);
  }
  return parts.join("\n\n").replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
}
async function submitReport(ev){
  ev.preventDefault();
  if (!repCol) return;
  const msg = $("#rep-msg"), btn = $("#rep-submit");
  const file = $("#r-file").files?.[0];
  let text = $("#r-text").value.trim();
  const symbols = [...document.querySelectorAll(".r-sym:checked")].map(x => x.value);
  let title = $("#r-title").value.trim();
  if (!file && !text) { msg.textContent = "Choose a file or paste the text."; return; }
  if (!symbols.length) { msg.textContent = "Tick at least one position, or Whole portfolio."; return; }
  btn.disabled = true;
  try {
    if (file) {
      if (/\.pdf$/i.test(file.name) || file.type === "application/pdf") {
        msg.textContent = "Reading the PDF…";
        text = await extractPdf(file, (i, n) => { msg.textContent = `Reading page ${i} of ${n}…`; });
      } else text = await file.text();
      if (!title) title = file.name.replace(/\.[^.]+$/, "");
    }
    if (!text || text.length < 80) { msg.textContent = "No readable text found. If it's a scanned PDF, paste the text instead."; btn.disabled = false; return; }
    const MAX = 120000;
    const doc = { title: title || "Untitled report", publisher: $("#r-pub").value.trim(), date: $("#r-date").value || "",
      symbols, text: text.slice(0, MAX), chars: text.length, truncated: text.length > MAX, addedAt: Date.now() };
    msg.textContent = "Saving…";
    await repCol.add(doc);
    S.repOpen = false; S.repMsg = ""; render();
  } catch (e) {
    msg.textContent = e?.code === "quota_exceeded" ? "Storage is full. Delete an older report first."
      : e?.message === "load" ? "The PDF reader couldn't load. Paste the text instead."
      : `Couldn't save the report (${e?.code || e?.message || "error"}).`;
    btn.disabled = false;
  }
}

function gotoRef(key){ const r = S.agent?.refs?.[key]; if (r) gotoRefObj(r); }

  if (r.kind === "news") { S.tab = "news"; S.newsFilter = "all"; render(); if (!flash("art-"+r.id) && r.url) window.open(r.url, "_blank", "noopener"); }
  else if (r.kind === "call") { S.tab = "research"; render(); if (!flash("call-"+r.id) && r.url) window.open(r.url, "_blank", "noopener"); }

document.addEventListener("click", async ev => {
  const t = ev.target.closest("button, tr.row, .pcard, .sig");

  if (t.dataset.goto) { S.tab = t.dataset.goto; render(); window.scrollTo({top:0}); return; }
  if (t.matches(".sig")) { S.tab = "agent"; render(); document.getElementById("card-"+t.dataset.card)?.scrollIntoView({block:"start"}); return; }
  if (t.id === "refresh") { t.disabled = true; try { await mcp?.invalidate(); } catch {} setTimeout(render, 1500); return; }
  if (t.id === "add" || t.id === "add2") { S.formOpen = !(S.formOpen && !S.editing); S.editing = null; S.formMsg=""; render(); setTimeout(()=>$("#f-ticker")?.focus(), 0); return; }
  if (t.id === "cancel") { S.formOpen = false; S.editing = null; render(); return; }
  if (t.id === "rep-add" || t.id === "rep-add2") { S.repOpen = !S.repOpen; S.repMsg = ""; if (t.id === "rep-add2") S.repOpen = true; render(); setTimeout(()=>$("#r-title")?.focus(), 0); return; }
  if (t.id === "rep-cancel") { S.repOpen = false; render(); return; }
  if (t.id === "pack") { buildPack(); return; }
  if (t.id === "pack-stop") { if (packCtl) packCtl.stop = true; S.pack.msg = "Stopping after the current step…"; render(); return; }
  if (t.dataset.rf) { S.repFilter = t.dataset.rf; render(); return; }
  if (t.dataset.deep) { deepDive(t.dataset.deep); return; }
  if (t.dataset.deepopen) { S.deepOpen = S.deepOpen === t.dataset.deepopen ? null : t.dataset.deepopen; render(); return; }
  if (t.id === "deep-stop") { deepCtl?.abort(); return; }
  if (t.id === "deep-all") { deepDiveAll(); return; }
  if (t.id === "deep-all-stop") { S.deepQueue = S.deepBusy ? [S.deepBusy] : []; deepCtl?.abort(); render(); return; }
  if (t.dataset.fbopen) { S.fbOpen = t.dataset.fbopen; render(); setTimeout(() => document.getElementById("fb-note-"+t.dataset.fbopen)?.focus(), 0); return; }
  if (t.dataset.fbclose) { S.fbOpen = null; render(); return; }

    render(); return;
  }
  if (t.dataset.forget != null && S.memory) {
    const lessons = (S.memory.lessons||[]).filter((_, i) => i !== +t.dataset.forget);
    try { await memRef.set({ ...S.memory, lessons, updatedAt:Date.now() }); } catch {}
    return;
  }
  if (t.dataset.dref) { const [lab, k] = t.dataset.dref.split("|"); const r = S.deep[lab]?.refs?.[k]; if (r) gotoRefObj(r); return; }
  if (t.id === "run" || t.id === "run2") { if (t.id === "run2") S.tab = "agent"; runAgent(); return; }
  if (t.id === "stop") { agentCtl?.abort(); return; }

    try { await perms?.request(["mcp:"+AV, "mcp:"+BD, "mcp:"+TD]); } catch {}
    try { await mcp?.callTool(BD, "bigdata_search", { request: MKT.global }); } catch {}
    try { await mcp?.invalidate(); } catch {}
    render(); return;
  }

    catch (e) { if (msg) msg.textContent = `Couldn't save (${e?.code||"error"}).`; }

  if (act === "rep-del") { S.repDel = t.dataset.id; render(); return; }

  if (t.matches("tr.row, .pcard")) { const id = t.dataset.id; S.open = S.open === id ? null : id; S.confirmDel = null; render(); }
});
document.addEventListener("keydown", ev => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches?.("tr.row, .pcard, .sig")) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "posform") submitPosition(ev);
  if (ev.target.id === "repform") submitReport(ev);
});
setInterval(renderStatus, 30000);

/* ---------- boot ---------- */
render();
(async () => {
  if (!window.claude || typeof window.claude.use !== "function") { S.noRuntime = true; S.holdings = []; render(); return; }
  const use = n => window.claude.use(n).catch(() => null);
  const user = await use("user");
  [db, mcp, sample, perms] = await Promise.all([use("db"), use("mcp"), use("sample"), use("permissions")]);
  S.uid = user ? await user.id() : null;
  if (!db || !S.uid) { S.noStore = true; S.holdings = []; render(); }
  else {
    const desk = db.doc(`data/users/${S.uid}/desk`);
    holdCol = desk.collection("holdings");
    repCol = desk.collection("reports");
    deepCol = desk.collection("deep");
    histCol = desk.collection("history");
    memRef = db.doc(`data/users/${S.uid}/memory`);
    agentRef = db.doc(`data/users/${S.uid}/agent`);
    const timer = setTimeout(() => { if (S.holdings === null) { S.holdErr = { code:"timeout" }; render(); } }, 10000);
    holdCol.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); S.holdErr = null; }
      S.holdings = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      syncWatches(); render();
    }, e => { clearTimeout(timer); S.holdErr = e; S.holdings = S.holdings || []; render(); });
    repCol.onSnapshot(snap => { S.reports = snap.docs.map(d => ({ id:d.id, ...d.data() })); render(); }, () => {});
    agentRef.onSnapshot(snap => { if (snap.exists) { S.agent = snap.data(); render(); } }, () => {});
    histCol.onSnapshot(snap => { S.history = snap.docs.map(d => d.data()).filter(x => x && x.ranAt).sort((a,b) => b.ranAt - a.ranAt); render(); }, () => {});
    memRef.onSnapshot(snap => { S.memory = snap.exists ? snap.data() : null; render(); }, () => {});
    db.doc(`data/users/${S.uid}/quotes`).onSnapshot(snap => { const d = snap.exists ? snap.data() : null; S.backup = d?.quotes || {}; S.backupAt = d?.updatedAt || 0; if (S.backupAt) S.lastData = Math.max(S.lastData, S.backupAt); render(); }, () => {});
    db.doc(`data/users/${S.uid}/newsfeed`).onSnapshot(snap => { S.feed = snap.exists ? snap.data() : null; if (S.feed?.updatedAt) S.lastData = Math.max(S.lastData, S.feed.updatedAt); render(); }, () => {});
    db.doc(`data/users/${S.uid}/macro`).onSnapshot(snap => { S.macro = snap.exists ? snap.data() : null; render(); }, () => {});
    deepCol.onSnapshot(snap => { const m = {}; for (const d of snap.docs) { const x = d.data(); if (x && x.symbol) m[x.symbol] = x; } S.deep = m; render(); }, () => {});
  }
  syncWatches(); render();
  if (perms && mcp) {
    try { await perms.request(["mcp:"+AV, "mcp:"+BD, "mcp:"+TD]); } catch {}
    try { await mcp.invalidate(); } catch {}
  }
})();
})();
</script>
